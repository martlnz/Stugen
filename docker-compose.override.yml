# Cấu hình dev (tự nạp khi chạy docker compose): mount source backend, hot reload API.
services:
  api:
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers
             --forwarded-allow-ips='*'"
    volumes:
      - ./backend:/app

  worker:
    volumes:
      - ./backend:/app
